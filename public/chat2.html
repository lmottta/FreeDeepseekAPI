<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat2 — FreeDeepseekAPI</title>
<style>
:root {
  --bg: #ffffff;
  --bg-side: #f7f7f8;
  --bg-msg-user: #0ea5e9;
  --bg-msg-user-text: #ffffff;
  --bg-msg-asst: #f1f1f3;
  --bg-msg-asst-text: #1f2937;
  --bg-input: #ffffff;
  --border: #e5e7eb;
  --text: #111827;
  --text-dim: #6b7280;
  --accent: #0ea5e9;
  --accent-hover: #0284c7;
  --danger: #ef4444;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
html.dark {
  --bg: #0f1115;
  --bg-side: #16181d;
  --bg-msg-asst: #1c1f26;
  --bg-msg-asst-text: #e5e7eb;
  --bg-input: #16181d;
  --border: #262a33;
  --text: #e5e7eb;
  --text-dim: #9ca3af;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; height: 100vh; overflow: hidden;
  transition: background .15s, color .15s;
}
/* ===== Sidebar ===== */
#sidebar {
  width: 270px; min-width: 270px; background: var(--bg-side);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 40;
}
#sidebar .top { padding: 14px 12px 8px; }
#newChatBtn {
  width: 100%; display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-size: .9rem; font-weight: 600; color: var(--text);
  cursor: pointer; box-shadow: var(--shadow);
}
#newChatBtn:hover { border-color: var(--accent); }
#convList { flex: 1; overflow-y: auto; padding: 4px 8px 12px; list-style: none; }
#convList .empty { text-align: center; color: var(--text-dim); font-size: .82rem; padding: 24px 8px; }
.conv {
  position: relative; border-radius: 10px; padding: 9px 10px; margin-bottom: 2px;
  cursor: pointer; border: 1px solid transparent;
}
.conv:hover { background: var(--bg-msg-asst); }
.conv.active { background: var(--bg-msg-asst); border-color: var(--border); }
.conv .t { font-size: .87rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 26px; }
.conv .p { font-size: .75rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; padding-right: 26px; }
.conv .menu-btn {
  position: absolute; right: 6px; top: 8px; border: none; background: transparent;
  color: var(--text-dim); cursor: pointer; border-radius: 6px; padding: 3px 5px; font-size: 1rem; line-height: 1;
  display: none;
}
.conv:hover .menu-btn, .conv.active .menu-btn { display: block; }
.conv .menu-btn:hover { background: var(--border); }
.conv .menu {
  position: absolute; right: 6px; top: 32px; z-index: 50; min-width: 140px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 4px; display: none;
}
.conv .menu.open { display: block; }
.conv .menu button {
  display: block; width: 100%; text-align: left; border: none; background: transparent;
  padding: 8px 10px; font-size: .83rem; border-radius: 7px; cursor: pointer; color: var(--text);
}
.conv .menu button:hover { background: var(--bg-msg-asst); }
.conv .menu button.danger { color: var(--danger); }
.conv input.rename {
  width: 100%; font-size: .87rem; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--bg-input); color: var(--text); outline: none;
}
#sidebar .foot { padding: 10px 12px; border-top: 1px solid var(--border); font-size: .75rem; color: var(--text-dim); }
#sidebar .foot .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
#keyDot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
#keyDot.ok { background: #22c55e; }
/* ===== Main ===== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
header h1 { font-size: 1rem; font-weight: 700; }
header .spacer { flex: 1; }
#modelSel, .icon-btn {
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 9px; padding: 7px 9px; font-size: .82rem; cursor: pointer;
}
#modelSel { max-width: 220px; }
.icon-btn:hover { border-color: var(--accent); }
#burger { display: none; font-size: 1.2rem; }
/* ===== Messages ===== */
#msgs { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
#msgs .wrap { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; }
.row.user { justify-content: flex-end; }
.row.asst { justify-content: flex-start; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 700; margin-top: 2px;
}
.row.asst .avatar { background: var(--accent); color: #fff; }
.row.user .avatar { background: var(--border); color: var(--text-dim); }
.bubble {
  max-width: 78%; padding: 10px 14px; border-radius: var(--radius);
  font-size: .92rem; line-height: 1.55; word-break: break-word;
}
.row.user .bubble { background: var(--bg-msg-user); color: var(--bg-msg-user-text); border-bottom-right-radius: 3px; }
.row.asst .bubble { background: var(--bg-msg-asst); color: var(--bg-msg-asst-text); border-bottom-left-radius: 3px; }
.bubble .who { font-size: .72rem; font-weight: 600; opacity: .6; margin-bottom: 4px; }
.bubble .time { font-size: .7rem; opacity: .55; text-align: right; margin-top: 6px; }
.bubble pre {
  background: rgba(0,0,0,.78); color: #e5e7eb; border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; font-size: .82rem; margin: 8px 0; white-space: pre;
}
.bubble code.inline { background: rgba(127,127,127,.25); padding: 1px 6px; border-radius: 5px; font-size: .85em; font-family: monospace; }
.bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
.bubble details { margin-top: 8px; font-size: .8rem; }
.bubble details summary { cursor: pointer; opacity: .65; }
.bubble details pre { max-height: 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: .75rem;
  background: rgba(127,127,127,.22); border-radius: 7px; padding: 3px 8px;
}
.chip img { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; }
.msg-system { align-self: center; font-size: .78rem; color: var(--text-dim); }
/* typing */
.typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: b 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes b { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
/* welcome */
#welcome { text-align: center; padding: 48px 16px 8px; }
#welcome h2 { font-size: 1.5rem; margin-bottom: 6px; }
#welcome p { color: var(--text-dim); margin-bottom: 20px; }
.sugs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; max-width: 640px; margin: 0 auto; }
.sugs button {
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 10px; padding: 12px; font-size: .85rem; cursor: pointer; text-align: left;
}
.sugs button:hover { border-color: var(--accent); }
/* ===== Composer ===== */
#composer { border-top: 1px solid var(--border); padding: 12px 16px 10px; flex-shrink: 0; background: var(--bg); }
#composer .inner { max-width: 820px; margin: 0 auto; }
#attachBar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
#attachBar:empty { display: none; }
.att {
  display: inline-flex; align-items: center; gap: 7px; font-size: .78rem;
  border: 1px solid var(--border); border-radius: 9px; padding: 4px 8px; background: var(--bg-side);
}
.att img { width: 30px; height: 30px; object-fit: cover; border-radius: 6px; }
.att button { border: none; background: transparent; color: var(--danger); cursor: pointer; font-size: .9rem; }
#inputRow { display: flex; align-items: flex-end; gap: 8px; }
#plusWrap { position: relative; }
#plusMenu {
  position: absolute; bottom: 46px; left: 0; z-index: 50; min-width: 150px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 4px; display: none;
}
#plusMenu.open { display: block; }
#plusMenu button {
  display: block; width: 100%; text-align: left; border: none; background: transparent;
  padding: 8px 10px; font-size: .83rem; border-radius: 7px; cursor: pointer; color: var(--text);
}
#plusMenu button:hover { background: var(--bg-msg-asst); }
#ta {
  flex: 1; resize: none; min-height: 44px; max-height: 140px;
  border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px;
  font-size: .9rem; font-family: inherit; background: var(--bg-input); color: var(--text); outline: none;
}
#ta:focus { border-color: var(--accent); }
#sendBtn {
  border: none; background: var(--accent); color: #fff; border-radius: 11px;
  padding: 0 18px; height: 44px; font-size: .88rem; font-weight: 600; cursor: pointer;
}
#sendBtn:hover:not(:disabled) { background: var(--accent-hover); }
#sendBtn:disabled { opacity: .4; cursor: default; }
.hint { text-align: center; font-size: .7rem; color: var(--text-dim); margin-top: 6px; }
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; }
/* ===== Mobile ===== */
@media (max-width: 768px) {
  #sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  body.side-open #sidebar { transform: translateX(0); }
  body.side-open #overlay { display: block; }
  #burger { display: block; }
  .bubble { max-width: 88%; }
  #modelSel { max-width: 150px; }
}
</style>
</head>
<body>
<div id="overlay"></div>

<aside id="sidebar" aria-label="Conversas">
  <div class="top">
    <button id="newChatBtn" title="Nova conversa">+ Novo chat</button>
  </div>
  <ul id="convList"></ul>
  <div class="foot">
    <div class="row"><span><span id="keyDot"></span> <span id="keyStatus">chave: …</span></span></div>
    <div class="row"><span id="convCount"></span><button class="icon-btn" id="clearAllBtn" title="Apagar tudo">Limpar</button></div>
  </div>
</aside>

<div id="main">
  <header>
    <button class="icon-btn" id="burger" aria-label="Abrir menu">☰</button>
    <h1>Chat2</h1>
    <div class="spacer"></div>
    <select id="modelSel" title="Modelo"></select>
    <button class="icon-btn" id="streamBtn" title="Alternar streaming">⚡</button>
    <button class="icon-btn" id="themeBtn" title="Alternar tema">🌙</button>
  </header>

  <div id="msgs"><div class="wrap" id="wrap"></div></div>

  <div id="composer">
    <div class="inner">
      <div id="attachBar"></div>
      <div id="inputRow">
        <div id="plusWrap">
          <button class="icon-btn" id="plusBtn" title="Anexar" style="height:44px">+</button>
          <div id="plusMenu">
            <button data-t="text">📝 Texto</button>
            <button data-t="file">📎 Arquivo</button>
            <button data-t="image">🖼️ Imagem</button>
          </div>
        </div>
        <textarea id="ta" rows="1" placeholder="Escreva sua mensagem… (Enter envia, Shift+Enter quebra linha)"></textarea>
        <button id="sendBtn" disabled>Enviar</button>
      </div>
      <div class="hint">Enter envia • Shift+Enter nova linha • os modelos são os mesmos do /chat</div>
    </div>
  </div>
</div>

<input type="file" id="filePick" style="display:none">
<input type="file" id="imgPick" accept="image/*" style="display:none">

<script>
'use strict';
/* ============ estado ============ */
const LS_CONV = 'chat2_conversations_v1';
const LS_THEME = 'chat2_theme_v1';
const LS_ACTIVE = 'chat2_active_v1';
let convs = [], activeId = null, loading = false;
let apiKey = '', attachments = [], showReason = true, streamOn = true;

const $ = id => document.getElementById(id);
const wrap = $('wrap'), msgs = $('msgs'), ta = $('ta'), sendBtn = $('sendBtn');
const convList = $('convList'), modelSel = $('modelSel');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const nowHM = d => { d = new Date(d); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ============ persistência ============ */
function save() { try { localStorage.setItem(LS_CONV, JSON.stringify(convs)); localStorage.setItem(LS_ACTIVE, activeId || ''); } catch(e){} }
function load() {
  try {
    convs = JSON.parse(localStorage.getItem(LS_CONV) || '[]');
    convs.forEach(c => { c.createdAt = new Date(c.createdAt); c.updatedAt = new Date(c.updatedAt); (c.messages||[]).forEach(m => m.createdAt = new Date(m.createdAt)); });
    activeId = localStorage.getItem(LS_ACTIVE) || null;
    if (activeId && !convs.some(c => c.id === activeId)) activeId = null;
    if (!activeId && convs.length) activeId = convs[0].id;
  } catch(e){ convs = []; activeId = null; }
}
const active = () => convs.find(c => c.id === activeId);
function titleOf(text) { const w = String(text).trim().split(/\s+/).slice(0,6).join(' '); return w.length > 42 ? w.slice(0,39)+'…' : (w || 'Nova conversa'); }

/* ============ tema ============ */
function applyTheme(t) { document.documentElement.classList.toggle('dark', t === 'dark'); $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; try{localStorage.setItem(LS_THEME,t);}catch(e){} }
applyTheme(localStorage.getItem(LS_THEME) || 'light');
$('themeBtn').onclick = () => applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');

/* ============ chave + modelos (mesmo backend do /chat) ============ */
function setKey(k, auto) {
  apiKey = (k||'').trim();
  $('keyDot').className = apiKey ? 'ok' : '';
  $('keyDot').id = 'keyDot';
  $('keyStatus').textContent = apiKey ? ('chave: ' + (auto ? 'auto ✔' : 'manual ✔')) : 'chave: ausente';
}
async function bootKey() {
  try { const r = await fetch('/api/proxy-key'); const d = await r.json(); if (d.key) { setKey(d.key, true); return; } } catch(e){}
  setKey('', false);
}
const FALLBACK_MODELS = ['deepseek-chat','deepseek-v3','deepseek-default','deepseek-reasoner','deepseek-r1','deepseek-chat-search','deepseek-default-search','deepseek-reasoner-search','deepseek-r1-search','deepseek-expert','deepseek-v4-pro'];
async function bootModels() {
  let ids = FALLBACK_MODELS;
  try {
    const h = apiKey ? { 'Authorization': 'Bearer ' + apiKey } : {};
    const r = await fetch('/v1/models', { headers: h });
    if (r.ok) { const d = await r.json(); if (d.data && d.data.length) ids = d.data.map(m => m.id); }
  } catch(e){}
  modelSel.innerHTML = ids.map(id => '<option value="' + esc(id) + '"' + (id==='deepseek-chat'?' selected':'') + '>' + esc(id) + '</option>').join('');
}

/* ============ conversas: CRUD ============ */
function newConversation(select = true) {
  const c = { id: uid(), title: 'Nova conversa', createdAt: new Date(), updatedAt: new Date(), messages: [] };
  convs.unshift(c); if (select) activeId = c.id;
  save(); renderList(); renderMsgs(); ta.focus();
}
function delConversation(id) {
  const c = convs.find(x => x.id === id); if (!c) return;
  if (!confirm('Excluir "' + c.title + '"?')) return;
  convs = convs.filter(x => x.id !== id);
  if (activeId === id) activeId = convs.length ? convs[0].id : null;
  if (!convs.length) { save(); renderList(); newConversation(); return; }
  save(); renderList(); renderMsgs();
}
function renderList() {
  $('convCount').textContent = convs.length + ' conversa(s)';
  if (!convs.length) { convList.innerHTML = '<div class="empty">Nenhuma conversa.<br>Clique em + Novo chat.</div>'; return; }
  convList.innerHTML = '';
  convs.forEach(c => {
    const li = document.createElement('li');
    li.className = 'conv' + (c.id === activeId ? ' active' : '');
    const last = (c.messages||[]).slice(-1)[0];
    const prev = last ? (last.content.slice(0, 44) + (last.content.length > 44 ? '…' : '')) : 'vazia';
    li.innerHTML = '<div class="t"></div><div class="p"></div>' +
      '<button class="menu-btn" title="Opções">⋮</button>' +
      '<div class="menu"><button data-a="ren">✏️ Renomear</button><button data-a="del" class="danger">🗑 Excluir</button></div>';
    li.querySelector('.t').textContent = c.title;
    li.querySelector('.p').textContent = prev;
    li.onclick = e => {
      if (e.target.closest('.menu') || e.target.closest('.menu-btn') || e.target.tagName === 'INPUT') return;
      activeId = c.id; save(); renderList(); renderMsgs();
      document.body.classList.remove('side-open');
    };
    const menu = li.querySelector('.menu');
    li.querySelector('.menu-btn').onclick = e => { e.stopPropagation(); document.querySelectorAll('.conv .menu.open').forEach(m => { if (m !== menu) m.classList.remove('open'); }); menu.classList.toggle('open'); };
    menu.querySelector('[data-a="ren"]').onclick = e => {
      e.stopPropagation(); menu.classList.remove('open');
      const t = li.querySelector('.t');
      const inp = document.createElement('input');
      inp.className = 'rename'; inp.value = c.title;
      t.replaceWith(inp); inp.focus(); inp.select();
      const done = ok => { if (ok && inp.value.trim()) { c.title = inp.value.trim(); c.updatedAt = new Date(); save(); } renderList(); };
      inp.onkeydown = ev => { if (ev.key === 'Enter') done(true); else if (ev.key === 'Escape') done(false); };
      inp.onblur = () => done(true);
    };
    menu.querySelector('[data-a="del"]').onclick = e => { e.stopPropagation(); menu.classList.remove('open'); delConversation(c.id); };
    convList.appendChild(li);
  });
}
document.addEventListener('click', () => document.querySelectorAll('.conv .menu.open').forEach(m => m.classList.remove('open')));
$('newChatBtn').onclick = () => { newConversation(); document.body.classList.remove('side-open'); };
$('clearAllBtn').onclick = () => { if (convs.length && confirm('Apagar TODAS as conversas?')) { convs = []; activeId = null; save(); newConversation(); } };
$('burger').onclick = () => document.body.classList.toggle('side-open');
$('overlay').onclick = () => document.body.classList.remove('side-open');

/* ============ mensagens ============ */
function fmtBody(text) {
  const parts = esc(text).split(/```/);
  let out = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) { out += '<pre>' + parts[i].replace(/^\w+\n/, '') + '</pre>'; continue; }
    out += parts[i]
      .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
      .replace(/\n/g, '<br>');
  }
  return out;
}
function bubble(m) {
  const row = document.createElement('div');
  row.className = 'row ' + (m.role === 'user' ? 'user' : 'asst');
  const av = m.role === 'user' ? '<div class="avatar">V</div>' : '<div class="avatar">D</div>';
  let inner = m.role === 'assistant' ? '<div class="who">Assistente</div>' : '';
  inner += '<div>' + fmtBody(m.content) + '</div>';
  if (m.reasoning) inner += '<details><summary>raciocínio</summary><pre>' + esc(m.reasoning) + '</pre></details>';
  if (m.attachments && m.attachments.length) {
    inner += '<div class="chips">' + m.attachments.map(a =>
      a.url && a.url.startsWith('data:image')
        ? '<span class="chip"><img src="' + a.url + '" alt="">' + esc(a.name) + '</span>'
        : '<span class="chip">📎 ' + esc(a.name) + '</span>').join('') + '</div>';
  }
  inner += '<div class="time">' + nowHM(m.createdAt) + '</div>';
  row.innerHTML = (m.role === 'assistant' ? av : '') + '<div class="bubble">' + inner + '</div>' + (m.role === 'user' ? av : '');
  return row;
}
function sysMsg(t) { const d = document.createElement('div'); d.className = 'msg-system'; d.textContent = t; return d; }
function renderMsgs() {
  wrap.innerHTML = '';
  const c = active();
  if (!c || !c.messages.length) {
    const w = document.createElement('div'); w.id = 'welcome';
    w.innerHTML = '<h2>Como posso ajudar?</h2><p>Escolha um exemplo ou escreva abaixo. Modelos: os mesmos do /chat.</p><div class="sugs"></div>';
    const sugs = ['Explique este código', 'Crie uma API em Python', 'Analise este texto', 'Resuma um documento'];
    const box = w.querySelector('.sugs');
    sugs.forEach(s => { const b = document.createElement('button'); b.textContent = s; b.onclick = () => { ta.value = s; autosize(); ta.focus(); }; box.appendChild(b); });
    wrap.appendChild(w);
  } else {
    c.messages.forEach(m => wrap.appendChild(bubble(m)));
  }
  msgs.scrollTop = msgs.scrollHeight;
}

/* ============ composer ============ */
function autosize() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; syncSend(); }
function syncSend() { sendBtn.disabled = loading || (!ta.value.trim() && !attachments.length); }
ta.addEventListener('input', autosize);
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('plusBtn').onclick = e => { e.stopPropagation(); $('plusMenu').classList.toggle('open'); };
document.addEventListener('click', () => $('plusMenu').classList.remove('open'));
$('plusMenu').querySelectorAll('button').forEach(b => b.onclick = e => {
  e.stopPropagation(); $('plusMenu').classList.remove('open');
  const t = b.dataset.t;
  if (t === 'file') $('filePick').click();
  else if (t === 'image') $('imgPick').click();
  else ta.focus();
});
$('filePick').onchange = e => addFiles(e.target.files, false);
$('imgPick').onchange = e => addFiles(e.target.files, true);
function addFiles(files, isImg) {
  for (const f of files) {
    if (isImg && !f.type.startsWith('image/')) continue;
    const a = { name: f.name, size: f.size, url: null };
    if (isImg) {
      const r = new FileReader();
      r.onload = ev => { a.url = ev.target.result; drawAtts(); };
      r.readAsDataURL(f);
    }
    attachments.push(a);
  }
  drawAtts();
}
function drawAtts() {
  const bar = $('attachBar'); bar.innerHTML = '';
  attachments.forEach((a, i) => {
    const d = document.createElement('span'); d.className = 'att';
    d.innerHTML = (a.url ? '<img src="' + a.url + '" alt="">' : '📎 ') +
      '<span>' + esc(a.name) + ' <small>(' + (a.size/1024).toFixed(1) + ' KB)</small></span>';
    const x = document.createElement('button'); x.textContent = '✕'; x.title = 'Remover';
    x.onclick = () => { attachments.splice(i, 1); drawAtts(); syncSend(); };
    d.appendChild(x); bar.appendChild(d);
  });
  syncSend();
}
function buildText() {
  let t = ta.value.trim();
  if (attachments.length) t += (t ? '\n\n' : '') + '[Anexos: ' + attachments.map(a => a.name).join(' | ') + ']';
  return t;
}

/* ============ envio (mesmo backend do /chat) ============ */
$('streamBtn').onclick = () => { streamOn = !streamOn; $('streamBtn').style.opacity = streamOn ? '1' : '.4'; };
async function send() {
  const text = buildText();
  if ((!text && !attachments.length) || loading) return;
  let c = active();
  if (!c) { newConversation(); c = active(); }
  const userMsg = { id: uid(), role: 'user', content: text || '(anexo)', createdAt: new Date(),
    attachments: attachments.map(a => ({ name: a.name, url: a.url })) };
  if (!c.messages.length) c.title = titleOf(text);
  c.messages.push(userMsg); c.updatedAt = new Date();
  ta.value = ''; attachments = []; drawAtts(); autosize();
  save(); renderList(); renderMsgs();

  const hist = c.messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }));
  const div = document.createElement('div');
  div.className = 'row asst';
  div.innerHTML = '<div class="avatar">D</div><div class="bubble"><div class="who">Assistente</div><div class="body"><span class="typing"><span></span><span></span><span></span></span></div></div>';
  wrap.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
  const body = div.querySelector('.body');
  loading = true; syncSend();

  const headers = { 'Content-Type': 'application/json' };
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST', headers,
      body: JSON.stringify({ model: modelSel.value, messages: hist, stream: streamOn })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || ('Erro HTTP ' + resp.status));
    }
    let content = '', reasoning = '';
    if (!streamOn) {
      const data = await resp.json();
      content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      reasoning = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.reasoning_content) || '';
      body.innerHTML = '<div>' + fmtBody(content) + '</div>';
    } else {
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (line.slice(0, 6) !== 'data: ') continue;
          const s = line.slice(6).trim();
          if (!s || s === '[DONE]') continue;
          try {
            const d = JSON.parse(s), delta = (d.choices && d.choices[0] && d.choices[0].delta) || {};
            if (delta.reasoning_content) reasoning += delta.reasoning_content;
            if (delta.content) { content += delta.content; body.innerHTML = '<div>' + fmtBody(content) + '</div>'; msgs.scrollTop = msgs.scrollHeight; }
          } catch(e){}
        }
      }
      body.innerHTML = '<div>' + fmtBody(content) + '</div>';
    }
    if (reasoning && showReason) {
      const det = document.createElement('details');
      det.innerHTML = '<summary>raciocínio</summary>';
      const pre = document.createElement('pre'); pre.textContent = reasoning;
      det.appendChild(pre); body.appendChild(det);
    }
    c.messages.push({ id: uid(), role: 'assistant', content: content, reasoning: reasoning || undefined, createdAt: new Date() });
    c.updatedAt = new Date(); save(); renderList();
    body.parentElement.insertAdjacentHTML('beforeend', '<div class="time">' + nowHM(new Date()) + '</div>');
  } catch (err) {
    body.innerHTML = '<span style="color:var(--danger)">Erro: ' + esc(err.message) + '</span>';
  } finally {
    loading = false; syncSend(); msgs.scrollTop = msgs.scrollHeight;
  }
}
sendBtn.onclick = send;

/* ============ boot ============ */
(async function boot() {
  load();
  if (!convs.length) { const c = { id: uid(), title: 'Nova conversa', createdAt: new Date(), updatedAt: new Date(), messages: [] }; convs.push(c); activeId = c.id; save(); }
  await bootKey();
  await bootModels();
  renderList(); renderMsgs(); autosize();
  if (window.innerWidth > 768) ta.focus();
})();
</script>
</body>
