<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeDeepseekAPI — Chat Com Funcionalidades</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Cantarell, sans-serif; }
body { background: #0b0f19; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 320px; background: #111827; border-right: 1px solid #1f2937; padding: 16px; overflow-y: auto; }
.sidebar h2 { color: #60a5fa; font-size: 1.1rem; margin-bottom: 12px; }
.card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.card h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
.btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; margin-right: 4px; }
.btn:hover { background: #1d4ed8; }
.btn.secondary { background: #374151; }
.btn.secondary:hover { background: #4b5563; }
.chat-area { flex: 1; display: flex; flex-direction: column; background: linear-gradient(180deg, #0b0f19 0%, #111827 100%); }
.header { padding: 14px 20px; border-bottom: 1px solid #1f2937; display: flex; gap: 10px; align-items: center; }
.header h1 { font-size: 1.1rem; color: #f1f5f9; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-size: 0.95rem; }
.msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
.msg.assistant { align-self: flex-start; background: #1f2937; border: 1px solid #374151; color: #e2e8f0; border-bottom-left-radius: 2px; }
.msg.system { align-self: center; background: transparent; color: #64748b; font-size: 0.8rem; }
.input-row { padding: 14px 16px; background: #111827; border-top: 1px solid #1f2937; }
.input-row textarea { width: 100%; background: #0b0f19; border: 1px solid #374151; border-radius: 8px; padding: 10px; color: #fff; resize: vertical; min-height: 60px; font-family: inherit; }
.toolbar { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.attachment-preview { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.preview-item { position: relative; border: 1px solid #374151; border-radius: 6px; overflow: hidden; max-width: 120px; }
.preview-item img { max-width: 120px; max-height: 80px; display: block; }
.preview-item .label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.7rem; padding: 2px 4px; }
.input-row input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="sidebar">
  <h2>DeepSeek Chat</h2>

  <div class="card">
    <h3>Modelo</h3>
    <select id="model" style="width:100%;padding:6px;background:#0b0f19;border:1px solid #374151;border-radius:6px;color:#fff;"><option value="deepseek-chat" selected>Flash</option><option value="deepseek-v4-pro">V4 Pro (raciocínio)</option><option value="deepseek-reasoner">Raciocínio Avançado</option><option value="deepseek-v3">V3</option></select>
  </div>

  <div class="card">
    <h3>Arquivo</h3>
    <label class="btn" style="display:inline-block;cursor:pointer;">+ Imagem / Doc / Link<input type="file" id="fileInput" multiple onchange="handleFiles(this)" accept="image/*,.pdf,.txt,.md,.json"></label>
    <button class="btn secondary" onclick="clearAttachments()">Limpar</button>
    <div id="attachPreview" class="attachment-preview"></div>
  </div>

  <div class="card">
    <h3>Sessão</h3>
    <button class="btn" onclick="forkSession()">Fork Conversa</button>
    <button class="btn" onclick="copySession()">Copiar Conversa</button>
    <button class="btn secondary" onclick="refineSession()">Refinar / Reenviar</button>
  </div>

  <div class="card">
    <h3>Config</h3>
    <label><input type="checkbox" id="streamToggle" checked style="width:auto;"> Streaming</label>
    <label><input type="checkbox" id="reasoningToggle" style="width:auto;"> Mostrar Raciocínio</label>
    <button class="btn secondary" onclick="forceCaptureKey()">Capturar Bearer</button>
  </div>

  <div class="card">
    <h3>Chave (Bearer)</h3>
    <input id="apiKey" type="password" placeholder="Auto ou inserir" style="width:100%;padding:6px;background:#0b0f19;border:1px solid #374151;border-radius:6px;color:#fff;"><br>
    <button class="btn" onclick="clearHistory()" style="margin-top:6px;">Limpar Histórico</button>
  </div>
</div>

<div class="chat-area">
  <div class="header"><h1>FreeDeepseekAPI — Chat Funcional</h1></div>
  <div class="messages" id="messages"><div class="msg system">Pronto. Use "Fork" para nova sessão, "Refinar" para reprocessar.</div></div>
  <div class="input-row">
    <textarea id="promptInput" placeholder="Digite aqui... (Shift+Enter = nova linha / Enter = enviar)" onkeydown="keyHandler(event)"></textarea>
    <div class="toolbar">
      <button class="btn" onclick="sendMessage()">Enviar</button>
      <button class="btn secondary" onclick="attachLink()">Link</button>
    </div>
  </div>
</div>

<script>
const messagesContainer = document.getElementById('messages');
const promptInput = document.getElementById('promptInput');
const apiKeyInput = document.getElementById('apiKey');
const modelSelect = document.getElementById('model');
let history = [];
let attachments = [];
let sessionId = 'main';

// Auto-fill bearer em localhost
fetch('/api/proxy-key').then(r=>r.json()).then(d=>{if(d.key) apiKeyInput.value=d.key;}).catch(()=>{});

function keyHandler(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = text;
  messagesContainer.appendChild(div);
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
  return div;
}

function clearHistory() { history=[]; attachments=[]; sessionId='main'; messagesContainer.innerHTML='<div class="msg system">Novos dados limpos.</div>'; document.getElementById('attachPreview').innerHTML=''; }

function handleFiles(input) {
  for (let f of input.files) {
    attachments.push({name:f.name, size:f.size, type:f.type || 'document', file:f});
    showAttachment(f);
  }
  input.value='';
}

function showAttachment(file) {
  const p = document.createElement('div');
  p.className='preview-item';
  if (file.type && file.type.startsWith('image/')) {
    const img = document.createElement('img'); img.src = URL.createObjectURL(file); img.style.maxWidth='120px'; p.appendChild(img);
  } else {
    p.innerHTML='<div class="label">'+file.name+'</div>';
  }
  const rem = document.createElement('button'); rem.textContent='×'; rem.style='position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;'; rem.onclick=()=>{attachments=attachments.filter(a=>a.name!==file.name); p.remove();};
  p.appendChild(rem); p.style='position:relative;';
  document.getElementById('attachPreview').appendChild(p);
}

function clearAttachments() { attachments=[]; document.getElementById('attachPreview').innerHTML=''; }

function attachLink() {
  const url = prompt('Cole o link:');
  if (url) { attachments.push({name:'Link: '+url, url:url, type:'link'}); showLink(url); }
}
function showLink(url) {
  const p = document.createElement('div'); p.className='preview-item'; p.innerHTML='<a href="'+url+'" target="_blank" style="color:#60a5fa;font-size:0.85rem;">Link</a><button onclick="this.parentElement.remove();" style="position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;">×</button>'; p.style='position:relative;';
  document.getElementById('attachPreview').appendChild(p);
}

function buildContent() {
  let text = promptInput.value.trim();
  if (attachments.length) {
    const parts = attachments.map(a => a.url || a.name).join(' | ');
    text = text + '\n\n[Anexos: ' + parts + ']';
  }
  return text;
}

async function sendMessage() {
  const text = buildContent();
  if (!text) return;
  promptInput.value = '';
  appendMsg('user', text);
  history.push({role:'user', content:text});

  const assistantDiv = appendMsg('assistant', 'Pensando...');
  const apiKey = apiKeyInput.value.trim();
  const headers = {'Content-Type':'application/json'};
  if (apiKey) headers['Authorization']='Bearer '+apiKey;

  try {
    const stream = document.getElementById('streamToggle').checked;
    const resp = await fetch('/v1/chat/completions', {
      method:'POST', headers, body: JSON.stringify({
        model: modelSelect.value,
        messages: history,
        stream: stream
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || ('Erro HTTP '+resp.status));
    }
    assistantDiv.textContent = '';
    if (!stream) {
      const data = await resp.json();
      const content = data.choices?.[0]?.message?.content || '';
      assistantDiv.textContent = content;
      history.push({role:'assistant', content: content});
    } else {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      while (true) {
        const {done,value} = await reader.read(); if (done) break;
        const chunk = decoder.decode(value, {stream:true});
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const s = line.slice(6).trim();
            if (s === '[DONE]') continue;
            try {
              const d = JSON.parse(s);
              const c = d.choices?.[0]?.delta?.content || '';
              full += c;
              assistantDiv.textContent = full;
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch(e){}
          }
        }
      }
      history.push({role:'assistant', content: full});
    }
  } catch(err) {
    assistantDiv.textContent = 'Erro: '+err.message;
    assistantDiv.style.color='#ef4444';
  }
}

function forceCaptureKey() {
  fetch('/api/proxy-key').then(r=>r.json()).then(d=>{
    if(d.key){ apiKeyInput.value=d.key; appendMsg('system','Bearer capturado automaticamente.'); }
    else appendMsg('system','Key vazia — verifique .env.');
  }).catch(e=>appendMsg('system','Falha: '+e.message));
}

function forkSession() {
  const copy = JSON.parse(JSON.stringify(history));
  sessionId = 'fork_' + Date.now();
  history = copy;
  appendMsg('system', 'Nova sessão (fork) criada. ID: '+sessionId);
}

function copySession() {
  const text = history.map(h=>h.role+': '+h.content).join('\n\n');
  navigator.clipboard.writeText(text).then(()=>appendMsg('system','Conversa copiada para área de transferência.'));
}

function refineSession() {
  if (history.length < 2) { appendMsg('system','Sem mensagem suficiente para refinar.'); return; }
  const lastUser = history.filter(h=>h.role==='user').pop();
  const prompt = (lastUser ? lastUser.content : '') + '\n\n[Refine com raciocínio extra e detalhe completo, sem resumir.]';
  promptInput.value = prompt;
  appendMsg('system', 'Refinamento preparado no campo de entrada. Envie para reprocessar.');
}
</script>
</body>
</html>
